<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>二维码卡片 · 打印</title>
<style>
  :root{
    --ink:#1b1730;
    --gold:#a8802f;
    --line:#c9b28a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px;
    background:#efece5;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }

  .tip{
    font-size:13px; color:#6b6355; line-height:1.9; text-align:center;
    max-width:560px;
  }
  .tip b{color:#1b1730;}

  /* 卡片本体：默认 A6 大小，屏幕上按比例显示 */
  .card{
    width:105mm; height:148mm;
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:6px;
    padding:12mm 10mm;
    display:flex; flex-direction:column; align-items:center;
    justify-content:space-between;
    text-align:center;
    position:relative;
    box-shadow:0 10px 30px -18px rgba(0,0,0,.5);
  }
  .card::before{
    content:""; position:absolute; inset:4mm;
    border:1px solid rgba(201,178,138,.55);
    border-radius:3px; pointer-events:none;
  }

  .to{
    font-size:10px; letter-spacing:.34em; text-indent:.34em;
    color:var(--gold); margin:2mm 0 0;
  }
  h1{
    margin:6mm 0 0; font-weight:400;
    font-size:19px; letter-spacing:.22em; text-indent:.22em;
  }
  .qr{
    width:62mm; height:62mm; margin:5mm 0;
    image-rendering:pixelated;
    display:block;
  }
  .qr[src=""]{opacity:0;}
  .sub{
    margin:0; font-size:10.5px; line-height:2; letter-spacing:.1em; color:#5c5648;
  }
  .sign{
    margin:0; font-size:9px; letter-spacing:.3em; text-indent:.3em;
    color:var(--gold);
  }

  .missing{
    width:62mm; height:62mm; margin:5mm 0;
    display:grid; place-items:center;
    border:1px dashed #c9b28a; border-radius:4px;
    font-size:11px; color:#9b8f78; line-height:1.8; text-align:center;
  }

  @media print{
    body{background:#fff; padding:0; gap:0;}
    .tip{display:none;}
    .card{
      box-shadow:none; border-color:#e3d7bd;
      page-break-inside:avoid;
      margin:0;
    }
    @page{ size:A6; margin:0; }
  }
</style>
</head>
<body>

  <p class="tip">
    打印用法：把 <b>qr.png</b> 放在本文件同一层的上一级目录（就是 <b>birthday-gift/qr.png</b>），
    然后按 <b>Ctrl+P</b>。纸张选 <b>A6</b>（或 A4 打两张裁开），边距选「无」，勾掉页眉页脚。<br />
    成品约 105×148mm，二维码 62mm 见方，扫起来很轻松。纸上别用深色底、别压膜反光。
  </p>

  <div class="card">
    <p class="to">TO · YOU</p>

    <h1>扫我一下</h1>

    <img class="qr" id="qr" src="../qr.png" alt="" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'missing',textContent:'还没生成 qr.png\n用 tools/make_qr.py 生成后放进来'}))" />

    <p class="sub">扫开有一个礼物<br />要拆，要输暗号</p>

    <p class="sign">A LITTLE SOMETHING FOR YOU</p>
  </div>

</body>
</html>
